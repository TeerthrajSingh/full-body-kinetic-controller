<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow-Boxer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2d323b; --text:#e8eaed; --dim:#8b93a1; --hit:#ff5a4d; --ok:#4dd2a1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:800px){ main { grid-template-columns:1fr; } }
  .stage { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #flash { position:absolute; left:12px; top:12px; font-size:28px; font-weight:700; color:var(--hit); text-shadow:0 2px 8px #000; transform:none; }
  #countdown { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; transform:none; pointer-events:none; text-shadow:0 2px 12px #000; }
  #countdown .num { font-size:min(22vw,160px); font-weight:800; line-height:1; }
  #countdown .msg { font-size:20px; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:#3a404b; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, select:focus-visible { outline:2px solid var(--ok); outline-offset:2px; }
  select { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:6px 8px; font:inherit; }
  .stat { color:var(--dim); font-size:13px; }
  .stat b { color:var(--text); font-weight:600; }
  #readout { white-space:pre-line; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--dim); min-height:36px; }
  #log { flex:1; min-height:160px; max-height:340px; overflow:auto; font:13px/1.6 ui-monospace, Menlo, monospace; background:var(--bg); border-radius:6px; padding:8px; }
  #log div { border-bottom:1px solid var(--line); }
  label { font-size:13px; color:var(--dim); display:block; }
  label.inline { display:flex; gap:6px; align-items:center; }
  input[type=range] { width:100%; }
  small { color:var(--dim); }
  .gamestage { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:16/9; }
  canvas#game { transform:none; }
  #menu { position:absolute; inset:0; z-index:2; background:rgba(10,12,16,.86); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  #menu h2 { margin:0; font-size:clamp(24px,5vw,44px); letter-spacing:2px; }
  #menu p { margin:0; max-width:640px; white-space:pre-line; color:var(--dim); }
  #menu button { background:var(--hit); color:#fff; font-weight:700; padding:10px 22px; }
  #menu button.alt { background:var(--line); }
  #countdown { z-index:5; }
  .mini { aspect-ratio:4/3; }
  .mini #flash { font-size:16px; }
  #camp { position:absolute; inset:0; z-index:4; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; background:rgba(10,12,16,.55); pointer-events:none; padding:20px; }
  #camp .big { font-size:clamp(26px,5.5vw,56px); font-weight:800; }
  #camp .sub { font-size:18px; color:var(--dim); }
  details summary { cursor:pointer; font-weight:600; margin-bottom:8px; }
  table.cm { border-collapse:collapse; font:11px ui-monospace, Menlo, monospace; margin-top:6px; }
  table.cm th, table.cm td { border:1px solid var(--line); padding:2px 5px; text-align:center; }
</style>
</head>
<body>
<main>
  <section>
    <div class="gamestage">
      <canvas id="game"></canvas>
      <div id="menu"><h2 id="menuTitle"></h2><p id="menuMsg"></p><div class="row" id="menuBtns"></div></div>
      <div id="camp"></div>
      <div id="countdown" aria-live="assertive"></div>
    </div>
  </section>

  <aside>
    <h1>Camera &amp; tracker</h1>
    <div class="stage mini"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div id="flash"></div></div>
    <div class="row">
      <button id="start">Start camera</button>
      <button id="calib" disabled>Calibrate (stand neutral)</button>
    </div>
    <div class="row">
      <label class="inline">Delegate
        <select id="delegate"><option value="GPU">GPU</option><option value="CPU">CPU</option></select>
      </label>
      <label class="inline">Model
        <select id="model"><option value="lite">lite (fast)</option><option value="full">full (accurate)</option></select>
      </label>
    </div>
    <div class="stat">Status: <b id="status">idle</b> &nbsp; FPS: <b id="fps">0</b> &nbsp; Infer: <b id="infer">0</b> ms</div>

    <div>
      <label>Punch sensitivity, arm-lengths/sec (lower = easier to trigger): <b id="punchVal"></b></label>
      <input id="punchThr" type="range" min="1" max="8" step="0.25" value="2.5">
      <label>Dodge distance, sideways head shift (shoulder-widths): <b id="dodgeVal"></b></label>
      <input id="dodgeThr" type="range" min="0.2" max="1.5" step="0.05" value="0.5">
      <label>Duck depth, head drop (shoulder-widths): <b id="duckVal"></b></label>
      <input id="duckThr" type="range" min="0.2" max="1.2" step="0.05" value="0.4">
      <label class="inline"><input id="guardReq" type="checkbox"> Punches must start from guard (stricter, fewer false hits)</label>
    </div>

    <details open id="aiBox"><summary>AI gesture model</summary>
      <div class="row">
        <select id="recog"><option value="rules">Recognizer: rules</option><option value="ai">Recognizer: AI model</option></select>
        <button id="campBtn" disabled>Training Camp</button>
        <button id="expBtn">Export data</button>
      </div>
      <label>AI trigger confidence: <b id="aiThrVal">0.75</b></label>
      <input id="aiThr" type="range" min="0.5" max="0.95" step="0.05" value="0.75">
      <div id="aiStat" class="stat">No model yet. Start the camera, then run Training Camp (about 2 minutes).</div>
      <div id="aiBars"></div><div id="aiCm"></div>
    </details>
    <div id="readout"></div>
    <div id="log" aria-live="polite"></div>
    <small>Keyboard fallback: J / K = left / right punch, B = block (toggle), A / D = dodge left / right, S = duck.</small>
  </aside>
</main>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------- Landmark indexes (MediaPipe Pose) ---------- */
const NOSE = 0, L_SH = 11, R_SH = 12, L_EL = 13, R_EL = 14, L_WR = 15, R_WR = 16, L_HIP = 23, R_HIP = 24;
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[0,11],[0,12]];

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODELS = {
  lite: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
  full: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
};

/* ---------- Config ----------
   All gesture distances are in body-relative units (arm lengths / torso lengths),
   measured on MediaPipe's metric 3D world landmarks, so they don't depend on how
   far you stand from the camera or on the 4:3 frame shape. */
const cfg = {
  // punch
  punchVel: 2.5,          // wrist reach velocity needed to start a punch, in arm-lengths per second
  minReach: 0.65,         // at the end of the punch the wrist must be this far from the shoulder (1 = arm fully straight)
  minElbowAngle: 100,     // degrees at the end of the punch
  minTravel: 0.2,         // wrist must have moved at least this much (in arm-lengths) away from the shoulder
  requireGuard: false,    // punch must start from a bent-arm (guard) position
  guardReach: 0.78,       // reach below this counts as "guard"
  guardWindowMs: 800,     // ...within this recent window
  punchCooldownMs: 300,   // same hand: minimum gap between punches
  punchGlobalCooldownMs: 400, // any hand: after one punch, nothing else fires for this long
  rearmDrop: 0.2,         // after a punch the hand must pull back this much (arm-lengths) before it can punch again
  punchTimeoutMs: 450,    // a punch must finish within this time after it starts
  maxVel: 30,             // velocities above this (arm-lengths/s) are tracking glitches, ignored
  // block
  blockDist: 0.7,         // both wrists within this many arm-lengths of the nose
  blockRelease: 1.25,     // hysteresis: must move this much farther out to release
  blockHoldMs: 150,
  // dodge / duck (shoulder-widths, measured in the camera image against the calibrated neutral spot)
  dodge: 0.5,
  actionLockoutMs: 350,   // punch and dodge can't trigger within this time of each other
  duckDrop: 0.4,
  dodgeCooldownMs: 400,
  // tracking quality
  minVis: 0.5,            // ignore landmarks the model isn't confident about
  lostMs: 300             // no pose for this long = person lost, reset state
};

/* ---------- DOM ---------- */
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const logEl = $("log"), flashEl = $("flash"), dbgEl = $("readout");
const punchThr = $("punchThr"), dodgeThr = $("dodgeThr"), guardReq = $("guardReq"), duckThr = $("duckThr");
const showVals = () => { $("punchVal").textContent = cfg.punchVel; $("dodgeVal").textContent = cfg.dodge; $("duckVal").textContent = cfg.duckDrop; };
punchThr.oninput = () => { cfg.punchVel = +punchThr.value; showVals(); };
dodgeThr.oninput = () => { cfg.dodge = +dodgeThr.value; showVals(); };
duckThr.oninput = () => { cfg.duckDrop = +duckThr.value; showVals(); };
guardReq.onchange = () => { cfg.requireGuard = guardReq.checked; };
showVals();

/* ---------- Event bus: Person B listens to this ----------
   window.addEventListener("gesture", e => console.log(e.detail))
   detail = { type: "punch"|"block_start"|"block_end"|"dodge"|"duck", hand?, power?, dir?, t }
   hand / dir are from the PLAYER's point of view and match the mirrored on-screen view. */
function emit(detail) {
  detail.t = performance.now();
  window.dispatchEvent(new CustomEvent("gesture", { detail }));
}
window.addEventListener("gesture", (e) => {
  const d = e.detail;
  const text = d.type + (d.hand ? " " + d.hand : "") + (d.dir ? " " + d.dir : "") + (d.power ? " p=" + d.power.toFixed(2) : "");
  const row = document.createElement("div");
  row.textContent = text;
  logEl.prepend(row);
  while (logEl.children.length > 60) logEl.lastChild.remove();
  if (d.type === "punch" || d.type === "dodge" || d.type === "duck") {
    flashEl.textContent = text.toUpperCase();
    clearTimeout(flashEl._t);
    flashEl._t = setTimeout(() => (flashEl.textContent = ""), 400);
  }
});

/* ---------- Math helpers ---------- */
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 });
function angle3(a, b, c) { // angle at b, degrees, in 3D
  const v1 = [a.x - b.x, a.y - b.y, a.z - b.z], v2 = [c.x - b.x, c.y - b.y, c.z - b.z];
  const dot = v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2];
  const cos = dot / (Math.hypot(...v1) * Math.hypot(...v2) + 1e-9);
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

/* ---------- One Euro filter: smooth when still, responsive when moving ---------- */
class OneEuro {
  constructor(minCutoff, beta, dCutoff = 1) {
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.x = null; this.dx = 0; this.t = 0;
  }
  static alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.x === null) { this.x = v; this.dx = 0; this.t = t; return v; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * ((v - this.x) / dt - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (v - this.x);
    return this.x;
  }
}
class LandmarkFilter {
  constructor(minCutoff, beta) { this.mc = minCutoff; this.b = beta; this.f = null; }
  reset() { this.f = null; }
  apply(lms, t) {
    if (!this.f) this.f = lms.map(() => [0, 1, 2].map(() => new OneEuro(this.mc, this.b)));
    return lms.map((p, i) => ({ x: this.f[i][0].filter(p.x, t), y: this.f[i][1].filter(p.y, t), z: this.f[i][2].filter(p.z, t) }));
  }
}
const worldFilter = new LandmarkFilter(1.2, 3);   // meters
const viewFilter  = new LandmarkFilter(1.5, 6);   // normalized image coords (drawing only)

/* ---------- Gesture state ---------- */
const mkHand = (sh, el, wr) => ({
  sh, el, wr, prevReach: null, prevT: 0, vel: 0, reach: 0,
  lastPunch: 0, phase: 0, peak: 0, startT: 0, low: 9, lowT: 0, armed: true, maxSince: 0
});
const hands = { left: mkHand(L_SH, L_EL, L_WR), right: mkHand(R_SH, R_EL, R_WR) };

let armLen = 0.6, armN = 0;          // running estimate of arm length in meters (bone lengths don't change with pose)
let blocking = false, blockSince = 0;
let baseline = null;                 // { hx, hy, sw } head position + shoulder width in the image when standing neutral
let lastDodge = 0, latchSide = false, latchDuck = false, lastPunchAny = 0;
const calib = { active: false, samples: [] };
let countingDown = false;            // true during the pre-calibration countdown (no gestures fire)
let lastSeen = 0, lost = false, lastDbg = 0, headInfo = "";

function resetTracking() {
  worldFilter.reset(); viewFilter.reset();
  for (const h of Object.values(hands)) Object.assign(h, { prevReach: null, vel: 0, phase: 0, peak: 0, low: 9, lowT: 0, armed: true });
  if (blocking) { blocking = false; emit({ type: "block_end" }); }
  blockSince = 0; latchSide = false; latchDuck = false;
}

function process(lm, raw, now, img) {
  if (countingDown || window.aiMode) return;   // AI mode: the trained model decides, not the rules
  const vis = (i) => (raw[i].visibility ?? 1) >= cfg.minVis;

  const shMid = mid(lm[L_SH], lm[R_SH]), hipMid = mid(lm[L_HIP], lm[R_HIP]);
  const torso = dist3(shMid, hipMid);
  if (!(torso > 0.15)) return;                       // implausible pose, skip frame

  /* Arm length: sum of the two arm bones, averaged over visible arms, slowly refined */
  const samples = [];
  for (const h of Object.values(hands)) {
    if (vis(h.sh) && vis(h.el) && vis(h.wr)) samples.push(dist3(lm[h.sh], lm[h.el]) + dist3(lm[h.el], lm[h.wr]));
  }
  if (samples.length) {
    const s = samples.reduce((a, b) => a + b, 0) / samples.length;
    armN++;
    armLen += Math.max(0.01, 1 / armN) * (s - armLen);
    armLen = Math.max(0.35, Math.min(1.0, armLen));
  }

  /* Punches: wrist extends away from the shoulder fast, from a guard, ending near full extension */
  const dbg = [];
  for (const [name, h] of Object.entries(hands)) {
    if (!(vis(h.sh) && vis(h.el) && vis(h.wr))) { h.prevReach = null; h.phase = 0; h.vel = 0; continue; }
    const reach = dist3(lm[h.wr], lm[h.sh]) / armLen;       // ~0.3 in guard, ~1.0 straight arm
    h.reach = reach;

    if (reach < h.low || now - h.lowT > cfg.guardWindowMs) { h.low = reach; h.lowT = now; }  // recent minimum reach

    if (h.prevReach !== null) {
      const dt = (now - h.prevT) / 1000;
      if (dt > 0.004 && dt < 0.2) {
        let v = (reach - h.prevReach) / dt;                  // arm-lengths per second
        if (Math.abs(v) > cfg.maxVel) v = 0;                 // tracking glitch
        h.vel += 0.5 * (v - h.vel);
      } else h.vel = 0;
    }
    h.prevReach = reach; h.prevT = now;
    const ang = angle3(lm[h.sh], lm[h.el], lm[h.wr]);
    if (!h.armed) {                                          // after a punch, the hand must retract before it can punch again
      h.maxSince = Math.max(h.maxSince, reach);
      if (reach < h.maxSince - cfg.rearmDrop) h.armed = true;
    }

    if (h.phase === 0) {
      const fromGuard = !cfg.requireGuard || h.low < cfg.guardReach;
      if (h.vel > cfg.punchVel && fromGuard && now - h.lastPunch > cfg.punchCooldownMs && now - lastPunchAny > cfg.punchGlobalCooldownMs && h.armed && now - lastDodge > cfg.actionLockoutMs) {
        h.phase = 1; h.peak = h.vel; h.startT = now;
      }
    } else {
      h.peak = Math.max(h.peak, h.vel);
      const slowed = h.vel < 0.4 * h.peak;
      const extended = reach >= cfg.minReach && ang > cfg.minElbowAngle && reach - h.low >= cfg.minTravel;
      if (now - h.startT > cfg.punchTimeoutMs || h.vel < -1) {
        h.phase = 0;                                         // too slow, or already retracting: not a punch
      } else if (extended && (slowed || reach >= 0.92)) {
        h.lastPunch = now; h.phase = 0; h.low = reach; h.lowT = now;
        lastPunchAny = now; h.armed = false; h.maxSince = reach;
        for (const o of Object.values(hands)) if (o !== h) o.phase = 0;   // the other arm just swinging along is not a second punch
        emit({ type: "punch", hand: name, power: Math.min(1, h.peak / (cfg.punchVel * 2)) });
      }
    }
    dbg.push(`${name[0].toUpperCase()} reach ${reach.toFixed(2)} vel ${h.vel.toFixed(1)}`);
  }

  /* Block: both wrists up near the face, with hysteresis */
  let nearFace = false;
  if (vis(L_WR) && vis(R_WR) && vis(NOSE)) {
    const lim = cfg.blockDist * armLen * (blocking ? cfg.blockRelease : 1);
    const high = lm[L_WR].y < shMid.y + 0.1 * torso && lm[R_WR].y < shMid.y + 0.1 * torso;   // y grows downward
    nearFace = high && dist3(lm[L_WR], lm[NOSE]) < lim && dist3(lm[R_WR], lm[NOSE]) < lim;
  }
  if (nearFace) {
    if (!blockSince) blockSince = now;
    if (!blocking && now - blockSince > cfg.blockHoldMs) { blocking = true; emit({ type: "block_start" }); }
  } else {
    blockSince = 0;
    if (blocking) { blocking = false; emit({ type: "block_end" }); }
  }

  /* Dodge / duck: head position in the camera IMAGE, relative to the calibrated neutral spot, in shoulder-widths.
     Image space is used on purpose: when you squat, your hips drop together with your head, so a
     hip-relative measure never sees the duck. */
  if (vis(NOSE) && vis(L_SH) && vis(R_SH)) {
    const aspect = video.videoWidth / video.videoHeight || 4 / 3;
    const hd = (vis(7) && vis(8)) ? mid(img[7], img[8]) : img[NOSE];   // ear midpoint barely moves when you turn your head
    const hx = hd.x * aspect, hy = hd.y;
    const swImg = Math.hypot((img[L_SH].x - img[R_SH].x) * aspect, img[L_SH].y - img[R_SH].y);
    if (calib.active) { calib.samples.push({ hx, hy, sw: swImg }); }
    else {
      if (!baseline) baseline = { hx, hy, sw: swImg };   // fall back to first frame until calibrated
      const unit = baseline.sw || 0.2;
      const side = (hx - baseline.hx) / unit;
      const drop = (hy - baseline.hy) / unit;            // image y grows downward, so positive = head went down
      headInfo = `head side ${side.toFixed(2)}  drop ${drop.toFixed(2)}`;
      if (latchSide && Math.abs(side) < cfg.dodge * 0.5) latchSide = false;
      if (latchDuck && drop < cfg.duckDrop * 0.5) latchDuck = false;
      const punching = Object.values(hands).some((h) => h.phase === 1 || now - h.lastPunch < cfg.actionLockoutMs);
      if (!punching && now - lastDodge > cfg.dodgeCooldownMs) {
        if (!latchDuck && drop > cfg.duckDrop) {
          lastDodge = now; latchDuck = true;
          emit({ type: "duck" });
        } else if (!latchSide && Math.abs(side) > cfg.dodge) {
          lastDodge = now; latchSide = true;
          // MediaPipe's +x is the player's LEFT. Direction is from the player's point of view.
          emit({ type: "dodge", dir: side > 0 ? "left" : "right" });
        }
      }
    }
  }

  if (now - lastDbg > 200) {
    lastDbg = now;
    dbgEl.textContent = dbg.join("  |  ") + `\narm ${armLen.toFixed(2)} m  torso ${torso.toFixed(2)} m\n${headInfo}`;
  }
}

/* ---------- Drawing ---------- */
function draw(lm, raw) {
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;   // resizing clears the canvas, so only do it on change
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lm) return;
  const W = canvas.width, H = canvas.height;
  const seen = (i) => (raw[i].visibility ?? 1) >= cfg.minVis;
  ctx.lineWidth = 3; ctx.strokeStyle = "#4dd2a1";
  for (const [a, b] of BONES) {
    if (!seen(a) || !seen(b)) continue;
    ctx.beginPath(); ctx.moveTo(lm[a].x * W, lm[a].y * H); ctx.lineTo(lm[b].x * W, lm[b].y * H); ctx.stroke();
  }
  ctx.fillStyle = "#ffffff";
  for (const i of [NOSE, L_SH, R_SH, L_EL, R_EL, L_WR, R_WR, L_HIP, R_HIP]) {
    if (!seen(i)) continue;
    ctx.beginPath(); ctx.arc(lm[i].x * W, lm[i].y * H, 5, 0, Math.PI * 2); ctx.fill();
  }
  if (blocking) { ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 6; ctx.strokeRect(0, 0, W, H); }
}

/* ---------- Main loop ---------- */
let landmarker = null, running = false;
let frames = 0, inferAcc = 0, lastFpsT = performance.now(), lastVideoTime = -1, lastTs = 0;

async function createLandmarker(delegate) {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODELS[$("model").value], delegate },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: 0.6,

};

function drawHUD(now) {
  label('YOU', 30, 22, 16, '#fff', 'left'); bar(30, 30, 340, 18, me.hp / 100, '#4dd2a1'); bar(30, 54, 340, 8, me.stamina / 100, '#4aa3ff');
  label(opp.name, W - 30, 22, 16, '#fff', 'right'); bar(W - 370, 30, 340, 18, opp.hp / opp.maxHp, '#ff5a4d', true);
  const left = state === 'fight' ? Math.max(0, FIGHT_MS - (now - fightStart)) : state === 'intro' ? FIGHT_MS : 0;
  label(Math.ceil(left / 1000), W / 2, 50, 32, '#fff');
  if (me.combo >= 2) label('COMBO x' + me.combo, 30, 100, 26, '#ffb020', 'left');
  if (state === 'fight' && opp.state === 'windup') label(ATK[opp.atk.type].hint, W / 2, 125, 38 + 4 * Math.sin(now / 80), '#ffb020');
  if (state === 'intro') label(now > fightStart - 700 ? 'FIGHT!' : 'GET READY', W / 2, 200, 64, '#fff');
  if (blocking) label('GUARD UP', W / 2, 515, 22, '#ffb020');
}

function draw(now) {
  g.save(); g.clearRect(0, 0, W, H);
  if (fx.shake > 0.5) g.translate(rnd(-1, 1) * fx.shake, rnd(-1, 1) * fx.shake);
  drawBg();
  if (opp && me) {
    g.save(); g.translate(fx.x, fx.y); drawOpp(now); g.restore();
    drawMine(now);
    for (const t of fx.texts) { const a = (now - t.t) / 900; g.globalAlpha = 1 - a; label(String(t.text), t.x, t.y - a * 60, t.size, t.color); g.globalAlpha = 1; }
    drawHUD(now);
    if (fx.hurt > 0.03) { g.fillStyle = `rgba(255,0,0,${fx.hurt * 0.35})`; g.fillRect(0, 0, W, H); }
  }
  g.restore();
}

function frame(now) {
  const dt = Math.min(50, now - (last || now)); last = now;
  update(now, dt); draw(now);
  requestAnimationFrame(frame);
}
window.gameState = () => state;
mainMenu();
requestAnimationFrame(frame);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id), video = $('video');
const CLASSES = ['idle', 'punch_left', 'punch_right', 'block', 'dodge_left', 'dodge_right', 'duck'];
const SHORT = ['idle', 'pL', 'pR', 'blk', 'dL', 'dR', 'duck'], MC = [0, 2, 1, 3, 5, 4, 6];   // MC: class after left-right mirroring
const PTS = [0, 7, 8, 11, 12, 13, 14, 15, 16, 23, 24], PERM = [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9];
const T = 12, STEP = 40, F = PTS.length * 3 + 2;        // a window = 12 samples, 40 ms apart (440 ms), independent of FPS
const PLAN = [['punch_left', 'LEFT PUNCH'], ['punch_right', 'RIGHT PUNCH'], ['block', 'HOLD GUARD UP'], ['dodge_left', 'DODGE LEFT'], ['dodge_right', 'DODGE RIGHT'], ['duck', 'DUCK']];
const REPS = 8, PERIOD = 2200, EPOCHS = 35;
let buf = [], data = [], model = null, norm = null, aiOn = false, camp = null, repId = 0;
let probs = CLASSES.map(() => 0), armed = {}, lastFire = {}, lastAny = 0, blocking = false, blockN = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const say = (t) => { $('aiStat').textContent = t; };
const show = (big, sub) => { const c = $('camp'); c.style.display = big ? 'flex' : 'none'; c.innerHTML = big ? `<div class="big"></div><div class="sub"></div>` : ''; if (big) { c.firstChild.textContent = big; c.lastChild.textContent = sub || ''; } };

/* ---------- features: body shape (torso-normalised world coords) + body position in the image ---------- */
function frameFeat(w, v, raw) {
  if ((raw[11].visibility ?? 1) < 0.5 || (raw[12].visibility ?? 1) < 0.5) return null;
  const s = { x: (w[11].x + w[12].x) / 2, y: (w[11].y + w[12].y) / 2, z: (w[11].z + w[12].z) / 2 };
  const torso = Math.hypot(s.x - (w[23].x + w[24].x) / 2, s.y - (w[23].y + w[24].y) / 2, s.z - (w[23].z + w[24].z) / 2) || 0.4;
  const f = new Float32Array(PTS.length * 3);
  PTS.forEach((p, i) => { f[i * 3] = (w[p].x - s.x) / torso; f[i * 3 + 1] = (w[p].y - s.y) / torso; f[i * 3 + 2] = (w[p].z - s.z) / torso; });
  const asp = video.videoWidth / video.videoHeight || 4 / 3;
  return { f, sx: (v[11].x + v[12].x) / 2 * asp, sy: (v[11].y + v[12].y) / 2, sw: Math.hypot((v[11].x - v[12].x) * asp, v[11].y - v[12].y) || 0.2 };
}
function windowAt(e) {
  const picks = []; let j = buf.length - 1;
  for (let i = T - 1; i >= 0; i--) {
    const tt = e - (T - 1 - i) * STEP;
    while (j > 0 && buf[j].t > tt) j--;
    if (!buf[j] || Math.abs(buf[j].t - tt) > 90) return null;     // tracking gap: skip
    picks[i] = buf[j];
  }
  const a = picks[0], out = new Float32Array(T * F);
  picks.forEach((fr, i) => { out.set(fr.f, i * F); out[i * F + 33] = (fr.sx - a.sx) / a.sw; out[i * F + 34] = (fr.sy - a.sy) / a.sw; });
  return out;
}
function mirror(x) {
  const o = new Float32Array(x.length);
  for (let t = 0; t < T; t++) {
    PTS.forEach((_, p) => { const s = t * F + p * 3, d = t * F + PERM[p] * 3; o[d] = -x[s]; o[d + 1] = x[s + 1]; o[d + 2] = x[s + 2]; });
    o[t * F + 33] = -x[t * F + 33]; o[t * F + 34] = x[t * F + 34];
  }
  return o;
}

window.onPoseFrame = (w, v, raw, t) => {
  const ft = frameFeat(w, v, raw); if (!ft) return;
  ft.t = t; buf.push(ft); while (buf.length > 60 && t - buf[0].t > 1200) buf.shift();
  const x = windowAt(t); if (!x) return;
  if (camp) camp.wins.push({ e: t, x }); else if (aiOn && model) infer(x, t);
};

/* ---------- live recognition ---------- */
const ev = (d) => window.dispatchEvent(new CustomEvent('gesture', { detail: { ...d, t: performance.now() } }));
function infer(x, now) {
  const z = new Float32Array(x.length); for (let i = 0; i < x.length; i++) z[i] = (x[i] - norm.mean[i % F]) / norm.std[i % F];
  const p = tf.tidy(() => model.predict(tf.tensor(z, [1, T, F])).dataSync());
  probs = probs.map((q, k) => q + 0.6 * (p[k] - q));
  const best = probs.indexOf(Math.max(...probs)), thr = +$('aiThr').value;
  for (const k of [1, 2, 4, 5, 6]) {
    if (probs[k] < 0.35) armed[k] = true;
    if (armed[k] !== false && best === k && probs[k] > thr && now - (lastFire[k] || 0) > 450 && now - lastAny > 250) {
      armed[k] = false; lastFire[k] = lastAny = now;
      if (k < 3) ev({ type: 'punch', hand: k === 1 ? 'left' : 'right', power: Math.min(1, 0.5 + 0.5 * probs[k]) });
      else if (k < 6) ev({ type: 'dodge', dir: k === 4 ? 'left' : 'right' });
      else ev({ type: 'duck' });
    }
  }
  blockN = probs[3] > 0.7 ? blockN + 1 : 0;
  if (!blocking && blockN >= 2) { blocking = true; ev({ type: 'block_start' }); }
  else if (blocking && probs[3] < 0.4) { blocking = false; ev({ type: 'block_end' }); }
}
setInterval(() => {
  $('campBtn').disabled = !video.srcObject;
  $('aiBars').innerHTML = CLASSES.map((c, k) => `<div class="stat">${c} <i style="display:inline-block;height:8px;width:${Math.round(probs[k] * 140)}px;background:var(--ok)"></i></div>`).join('');
}, 200);

/* ---------- Training Camp ---------- */
async function runCamp() {
  if (!video.srcObject) return say('Start the camera first.');
  window.aiMode = true; aiOn = false; data = []; repId = 0;
  const menu = $('menu'), prev = menu.style.display; menu.style.display = 'none';
  for (const [cls, text] of PLAN) {
    show(text, 'Get ready... you will repeat this move on cue'); await sleep(2800);
    camp = { wins: [] }; const cues = [], hold = cls === 'block';
    for (let k = 0; k < REPS; k++) {
      cues.push(performance.now()); show('NOW: ' + text, `rep ${k + 1} of ${REPS}`);
      await sleep(hold ? 1300 : 700); show('relax', 'stand ready'); await sleep(PERIOD - (hold ? 1300 : 700));
    }
    const [lo, hi] = hold ? [600, 1100] : [300, 700];
    for (const w of camp.wins) cues.forEach((c, k) => {
      const dt = w.e - c;
      if (dt >= lo && dt <= hi) data.push({ c: CLASSES.indexOf(cls), rep: repId + k, x: w.x });
      else if (dt >= -900 && dt <= -100) data.push({ c: 0, rep: repId + k, x: w.x });   // calm moments before the cue = "idle"
    });
    repId += REPS; camp = null;
  }
  show('MOVE FREELY', 'shuffle, scratch your head, wave your arms: but no moves!'); await sleep(2500);
  camp = { wins: [] }; const t0 = performance.now(); await sleep(12000);
  camp.wins.forEach((w) => data.push({ c: 0, rep: repId + Math.floor((w.e - t0) / 2500), x: w.x })); camp = null;
  show('Training the model...', ''); menu.style.display = prev;
  const need = CLASSES.findIndex((_, k) => data.filter((s) => s.c === k).length < 10);
  if (need >= 0) { show(''); window.aiMode = $('recog').value === 'ai'; return say(`Not enough data for "${CLASSES[need]}": was your upper body in view? Try again.`); }
  await train(); show(''); $('recog').value = 'ai'; aiOn = true; window.aiMode = true;
}

async function train() {
  await tf.ready(); await tf.setBackend('cpu');
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tr = data.filter((s) => s.rep % 4 !== 3), va = data.filter((s) => s.rep % 4 === 3);   // validation = whole held-out reps
  let aug = [];
  for (const s of tr) aug.push({ x: s.x, c: s.c }, { x: mirror(s.x), c: MC[s.c] });          // mirror augmentation
  aug = shuffle(aug.concat(aug.map((s) => ({ c: s.c, x: s.x.map((v) => v + (Math.random() - 0.5) * 0.05) }))));   // + noise
  const avg = CLASSES.slice(1).reduce((a, _, k) => a + aug.filter((s) => s.c === k + 1).length, 0) / 6; let idle = avg * 2.5;
  aug = aug.filter((s) => s.c !== 0 || idle-- > 0);
  const mean = new Array(F).fill(0), std = new Array(F).fill(0), n = aug.length * T;
  aug.forEach((s) => { for (let i = 0; i < s.x.length; i++) mean[i % F] += s.x[i] / n; });
  aug.forEach((s) => { for (let i = 0; i < s.x.length; i++) std[i % F] += (s.x[i] - mean[i % F]) ** 2 / n; });
  norm = { mean, std: std.map((v) => Math.sqrt(v) + 1e-3) };
  const toT = (set) => { const a = new Float32Array(set.length * T * F); set.forEach((s, i) => { for (let j = 0; j < T * F; j++) a[i * T * F + j] = (s.x[j] - norm.mean[j % F]) / norm.std[j % F]; }); return tf.tensor3d(a, [set.length, T, F]); };
  const oh = (set) => tf.oneHot(tf.tensor1d(set.map((s) => s.c), 'int32'), CLASSES.length);
  const xs = toT(aug), ys = oh(aug), xv = toT(va), yv = oh(va);
  if (model) model.dispose();
  model = tf.sequential({ layers: [
    tf.layers.conv1d({ inputShape: [T, F], filters: 24, kernelSize: 3, activation: 'relu', padding: 'same' }),
    tf.layers.conv1d({ filters: 32, kernelSize: 3, activation: 'relu', padding: 'same' }),
    tf.layers.flatten(), tf.layers.dropout({ rate: 0.3 }),
    tf.layers.dense({ units: 48, activation: 'relu' }), tf.layers.dense({ units: CLASSES.length, activation: 'softmax' })] });
  model.compile({ optimizer: tf.train.adam(0.003), loss: 'categoricalCrossentropy', metrics: ['accuracy'] });
  await model.fit(xs, ys, { epochs: EPOCHS, batchSize: 32, shuffle: true, validationData: [xv, yv], callbacks: { onEpochEnd: async (e, l) => {
    say(`Training ${e + 1}/${EPOCHS}  loss ${l.loss.toFixed(2)}  acc ${((l.acc ?? l.accuracy) * 100) | 0}%  val acc ${((l.val_acc ?? l.val_accuracy) * 100) | 0}%`); await tf.nextFrame(); } } });
  const pred = tf.tidy(() => model.predict(xv).argMax(-1).dataSync()), cm = CLASSES.map(() => CLASSES.map(() => 0));
  let ok = 0; va.forEach((s, i) => { cm[s.c][pred[i]]++; ok += s.c === pred[i]; });
  say(`Done. ${aug.length} training windows (after augmentation), ${va.length} held-out windows. Held-out accuracy ${(100 * ok / va.length).toFixed(1)}%`);
  $('aiCm').innerHTML = '<table class="cm"><tr><th>true \\ pred</th>' + SHORT.map((c) => `<th>${c}</th>`).join('') + '</tr>' + cm.map((r, i) => `<tr><th>${SHORT[i]}</th>${r.map((v) => `<td>${v}</td>`).join('')}</tr>`).join('') + '</table>';
  [xs, ys, xv, yv].forEach((t) => t.dispose());
  try { await model.save('indexeddb://sb-model'); localStorage.setItem('sb-norm', JSON.stringify(norm)); } catch (e) { /* storage unavailable */ }
}

$('campBtn').onclick = runCamp;
$('recog').onchange = () => {
  aiOn = $('recog').value === 'ai';
  if (aiOn && !model) { aiOn = false; $('recog').value = 'rules'; say('No model yet: run Training Camp first.'); }
  window.aiMode = aiOn;
};
$('aiThr').oninput = () => { $('aiThrVal').textContent = $('aiThr').value; };
$('expBtn').onclick = () => {
  if (!data.length) return say('Nothing to export yet: run Training Camp first.');
  const blob = new Blob([JSON.stringify({ classes: CLASSES, T, STEP, F, samples: data.map((s) => ({ c: s.c, rep: s.rep, x: Array.from(s.x, (v) => +v.toFixed(4)) })) })]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'shadow-boxer-moves.json'; a.click();
};
(async () => {
  try { await tf.ready(); await tf.setBackend('cpu'); const r = localStorage.getItem('sb-norm');
    if (r) { norm = JSON.parse(r); model = await tf.loadLayersModel('indexeddb://sb-model'); say('Saved model loaded. Choose "AI model" to use it.'); } } catch (e) { model = null; }
})();
})();
</script>
